<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Mask to create the cuts in the outer ring -->
    <mask id="outer-ring-cuts">
      <rect width="100%" height="100%" fill="white" />
      <!-- Top vertical cut (12 o'clock) -->
      <line x1="60" y1="60" x2="60" y2="-10" stroke="black" stroke-width="7" />
      <!-- Bottom-right angled cut (Approx 5 o'clock) -->
      <line x1="60" y1="60" x2="85" y2="103" stroke="black" stroke-width="7" />
    </mask>

    <!-- Mask to create the single cut in the middle ring -->
    <mask id="middle-ring-cuts">
      <rect width="100%" height="100%" fill="white" />
      <!-- Left horizontal cut (9 o'clock) -->
      <line x1="60" y1="60" x2="-10" y2="60" stroke="black" stroke-width="7" />
    </mask>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(0, 0)">
    <!-- Inner solid dot -->
    <circle cx="60" cy="60" r="11" fill="#000000" />

    <!-- Middle ring (with the 9 o'clock cut applied) -->
    <circle cx="60" cy="60" r="25" fill="none" stroke="#000000" stroke-width="8" mask="url(#middle-ring-cuts)" />

    <!-- Outer broken ring (with 12 o'clock and 5 o'clock cuts) -->
    <circle cx="60" cy="60" r="43" fill="none" stroke="#000000" stroke-width="9" mask="url(#outer-ring-cuts)" />
  </g>

  <!-- Logo Text -->
  <text x="120" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" fill="#000000" letter-spacing="-0.5">
    <tspan font-weight="400">Labor</tspan><tspan font-weight="700">Lens</tspan>
  </text>
</svg>